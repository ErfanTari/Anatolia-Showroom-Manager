<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Anatolia showroom operating process</title><desc id="desc">One SQLite source feeds deterministic evaluation, design proposals, Merch release, installation work and verified observations. The verified showroom feeds the next evaluation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#9aa98b" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#34422f}.label{font-size:14px;fill:#7e9070;letter-spacing:2px}.number{font-family:Georgia,serif;font-size:42px;fill:#a6b694}.heading{font-size:22px}.body{font-size:17px;fill:#79866e}.owner{font-size:14px;fill:#6e815e}.card{fill:#fff;stroke:#d9e1cf;stroke-width:1.5}.line{fill:none;stroke:#9aa98b;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1400" height="850" fill="#f5f7ef"/>
<text x="65" y="67" class="label">ANATOLIA / SHOWROOM STUDIO</text><text x="65" y="126" style="font-family:Georgia,serif;font-size:46px">From one source to a verified showroom.</text>
<text x="65" y="168" class="body">System, designer and agent share the same data and validation. Merch owns release.</text>
<g transform="translate(65 215)"><rect class="card" rx="10" width="390" height="215"/><text x="24" y="55" class="number">01</text><text x="24" y="92" class="heading">Source of truth</text><text x="24" y="127" class="body">Products, faces, fixtures and slots</text><text x="24" y="153" class="body">SQLite + governed CSV exchange</text><text x="24" y="188" class="owner">Sales · Merch · showroom observations</text></g>
<g transform="translate(505 215)"><rect class="card" rx="10" width="390" height="215"/><text x="24" y="55" class="number">02</text><text x="24" y="92" class="heading">Evaluate and design</text><text x="24" y="127" class="body">Coverage, repetition, visibility, color</text><text x="24" y="153" class="body">Replacement or bounded fixture move</text><text x="24" y="188" class="owner">Deterministic rules + agent/designer judgment</text></g>
<g transform="translate(945 215)"><rect class="card" rx="10" width="390" height="215"/><text x="24" y="55" class="number">03</text><text x="24" y="92" class="heading">Review the proposal</text><text x="24" y="127" class="body">Compare current and proposed in 3D</text><text x="24" y="153" class="body">Reasons, revision and missing inputs</text><text x="24" y="188" class="owner">Merch + Interior Design</text></g>
<path class="line" d="M458 320 H497"/><path class="line" d="M898 320 H937"/>
<g transform="translate(945 485)"><rect class="card" rx="10" width="390" height="215"/><text x="24" y="55" class="number">04</text><text x="24" y="92" class="heading">Release the work</text><text x="24" y="127" class="body">Confirm SKU, stock and compatibility</text><text x="24" y="153" class="body">Approve the complete work package</text><text x="24" y="188" class="owner">Merch authority</text></g>
<g transform="translate(505 485)"><rect class="card" rx="10" width="390" height="215"/><text x="24" y="55" class="number">05</text><text x="24" y="92" class="heading">Order, prepare, install</text><text x="24" y="127" class="body">Owner, due date and work evidence</text><text x="24" y="153" class="body">Record removed-material destination</text><text x="24" y="188" class="owner">Merch + installation team</text></g>
<g transform="translate(65 485)"><rect class="card" rx="10" width="390" height="215"/><text x="24" y="55" class="number">06</text><text x="24" y="92" class="heading">Verify the actual setup</text><text x="24" y="127" class="body">Evidence updates the placement record</text><text x="24" y="153" class="body">The simulation reads the same update</text><text x="24" y="188" class="owner">Showroom manager</text></g>
<path class="line" d="M1140 434 V477"/><path class="line" d="M942 590 H903"/><path class="line" d="M502 590 H463"/><path class="line" d="M250 481 V438"/>
<rect x="65" y="743" width="1270" height="65" rx="8" fill="#657659"/><text x="91" y="770" style="font-size:18px;fill:white">The next cycle begins with a launch, discontinuation, sales signal or showroom observation.</text><text x="91" y="794" style="font-size:14px;fill:#e2e9da">Every proposed change retains its source revision. Physical evidence closes the loop.</text>
</svg>
